manifestVersion: 1
name: somaos-next-motor-brain-so100-sim-deploy
catalog:
  name: robonix.robot.somaos_next.motor_brain_so100
  version: 1.1.0
  description: >
    SomaOS Brain Next — a lightweight, zero-dependency motor-execution
    robot brain targeting the Feetech SO-100 6-DoF serial manipulator.
    Focuses on deterministic runtime safety, dual-layer
    action filtering (intentional gating + instantaneous emergency stop),
    RCAN-standard command ingestion, HTTP-transport motor dispatch, and
    local experience-based learning. Designed to run on resource-constrained
    embedded-class compute (Raspberry Pi 4+ / Jetson Nano+) while keeping
    safety always active.
    Validation status: SIMULATION ONLY — the safety-gate filtering and
    trajectory-following execution paths are validated against a virtual
    servo model; no real SO-100 hardware deployment yet (real-robot
    integration is in progress). Distributed as a closed-source compiled
    binary runtime (downloadable from GitHub Release) and a closed-source
    container; sources and model weights are not published. Runnable demo
    packages are included in this repository.
  license: MulanPSL-2.0
  tags:
    - robot
    - deploy
    - so100
    - feetech
    - manipulator
    - simulation_validated
    - motor_brain
    - execution_only
    - realtime_safety
    - dual_action_filter
    - rcan
    - low_resource
    - zero_dependency
  maintainers:
    - SomaOS Brain Next Team <gm@jxt.asia>

primitive:
  - name: safety_gate_filter
    path: ./demos/safety_gate
    config:
      mode: demo
  - name: traj_follow_executor
    path: ./demos/traj_follow
    config:
      mode: demo
      seed: 3
      hz: 20

service:
  - name: somaos_motor_runtime
    path: ./docker
    config:
      delivery: closed_source_container
      container: ghcr.io/13717930620-alt/somaos-motor-brain:latest
      sources_published: false
      weights_published: false
  - name: somaos_motor_binary_runtime
    path: ./
    config:
      delivery: closed_source_binary
      release: https://github.com/13717930620-alt/somaos-next-motor-brain-so100/releases/tag/v1.1.0-bin
      entry: node loader.js
      healthcheck: http://127.0.0.1:3002/health
      sources_published: false
      weights_published: false

skill:
  - name: grasp_sequence_guard
    path: ./demos/safety_gate
    config:
      mode: demo

capabilities:
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/audio/speech_in
  - name: robonix/primitive/manipulator/move_to_pose
  - name: robonix/primitive/manipulator/grasp
  - name: robonix/primitive/manipulator/release
  - name: robonix/service/vla_inference
  - name: robonix/service/experience_replay
  - name: robonix/primitive/safety/emergency_stop

deploy_dependencies:
  - name: robonix/primitive/camera
    version: ">=1.0.0"
  - name: robonix/primitive/audio
    version: ">=1.0.0"
  - name: robonix/primitive/manipulator
    version: ">=1.0.0"
  - name: robonix/primitive/safety
    version: ">=1.0.0"
  - name: robonix/service/vla_inference
    version: ">=1.0.0"
